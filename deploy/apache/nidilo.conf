<VirtualHost *:80>
    ServerName nidilo.fr
    ServerAlias www.nidilo.fr

    DocumentRoot /var/www/nidilo/build/public
    DirectoryIndex disabled

    <Directory /var/www/nidilo/build/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.nidilo\.fr$ [NC]
    RewriteRule ^ https://nidilo.fr%{REQUEST_URI} [R=302,L,NE]

    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^/(.*)$ http://127.0.0.1:3337/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:3337/
    LimitRequestBody 13631488

    ErrorLog ${APACHE_LOG_DIR}/nidilo-error.log
    CustomLog ${APACHE_LOG_DIR}/nidilo-access.log combined
</VirtualHost>
