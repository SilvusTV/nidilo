<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName nidilo.fr
    ServerAlias www.nidilo.fr

    DocumentRoot /var/www/nidilo/build/public
    DirectoryIndex disabled

    <Directory /var/www/nidilo/build/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^www\.nidilo\.fr$ [NC]
    RewriteRule ^ https://nidilo.fr%{REQUEST_URI} [R=302,L,NE]

    RewriteCond %{REQUEST_FILENAME} -f
    RewriteRule ^ - [L]
    RewriteRule ^/(.*)$ http://127.0.0.1:3337/$1 [P,L]

    ProxyPassReverse / http://127.0.0.1:3337/
    LimitRequestBody 13631488

    ErrorLog ${APACHE_LOG_DIR}/nidilo-error.log
    CustomLog ${APACHE_LOG_DIR}/nidilo-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/nidilo.fr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/nidilo.fr/privkey.pem
</VirtualHost>
</IfModule>
